
name: CI Pipeline with Security & Quality Scans
on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]
    
jobs:

  build:
    runs-on: ubuntu-latest
    
    steps:
      
        - name: checkout code
          uses: actions/checkout@v5.0.0
        - name: node.js setup
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: install dependencies
          run: npm install
        - name: .run tests
          run: |
            mkdir -p test-results
            npm test -- --reporter mocha-junit-reporter --reporter-options mochaFile=./test-results/results.xml
        - name: publish test results
          uses: actions/upload-artifact@v4.6.2
          with:
            name: test-results-artifact
            path: test-results/results.xml

        - name : run code quality using eslint
          run: 
            set -o pipeline
            npx eslint . --ext .js,.jsx,.ts,.tsx --exit-on-fatal-error -f stylish | tee lint-report.txt

        - name: publish code quality tests
          uses: actions/upload-artifact@v4.6.2
          with:
            name: eslint-code-quality-artifacts
            path: lint-report .txt
 
        
